# blog.divops.kr: Vite 빌드 산출물(/assets, /icon.svg)만 nginx 가 직접 내주고, 나머지(화면·API·sitemap·robots)는 Go(127.0.0.1:8080)로 넘긴다.
# 화면도 Go 를 거치는 이유: 글 상세·목록의 <head>(title/description/og/canonical/JSON-LD)와 본문을 서버에서 넣어 크롤러가 JS 없이 읽게 하려고.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/plain text/xml application/xml application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # 예전 next.config redirects: blog.creco.dev → blog.divops.kr (308, 경로·쿼리 유지)
  server {
    listen 3000;
    server_name blog.creco.dev;
    return 308 https://blog.divops.kr$request_uri;
  }

  server {
    listen 3000 default_server;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Next.js 처럼 끝 슬래시를 떼는 308 리다이렉트 (/ 는 제외)
    location ~ ^(.+)/$ {
      return 308 $1$is_args$args;
    }

    # 해시가 붙은 빌드 산출물
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /icon.svg {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location / {
      # 이미지 업로드(UPLOAD_MAX_FILE_SIZE_MB) 보다 넉넉히. 실제 크기 검사는 Go 가 한다.
      client_max_body_size 50m;
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
